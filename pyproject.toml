[project]
name = "todoist-classifier"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai",
    "requests",
    "python-dotenv",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
todoist-classifier = "todoist_classifier:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["todoist_classifier"]
